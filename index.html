<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Female Viewer</title>
<style>html,body{margin:0;height:100%;background:#c9ccd1;font-family:system-ui;overflow:hidden}
#ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#fffc;padding:8px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw;box-shadow:0 1px 6px rgba(0,0,0,.12)}
#msg{position:fixed;top:12px;left:12px;color:#333;font-size:14px}button,select{font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid #999;background:#fff}
#spdWrap{display:none;align-items:center;gap:6px;font-size:13px;color:#333}
#spd{width:110px}canvas{display:block;touch-action:none}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script></head>
<body><div id="msg">Loading…</div>
<div id="ui"><select id="ver">
<option value="squat_v4" selected>squat v4 – fix=0 deep, clean thighs</option>
<option value="squat_pulse_v2">squat pulse v2 – morph deep↔half + jog bounce</option>
<option value="squat_v3">squat v3 – crease cleaned, forearms on knees</option>
<option value="squat_pulse">squat pulse v1 – deep↔half loop + bounce</option>
<option value="squat_v2">squat v2 – malasana ~10cm higher, forearms on knees</option>
<option value="squat">squat – deep yoga squat (malasana), forearms on knees</option>
</select>
<button id="play" style="display:none">Pause</button>
<span id="spdWrap"><label for="spd">Speed</label><input id="spd" type="range" min="0.3" max="2" step="0.1" value="1"><span id="spdVal">1.0/s</span></span>
<button id="rs">Reset view</button></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),0.04).texture;s.environmentIntensity=0.5;s.background=new THREE.Color(0xc9ccd1);
const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.05,100);
function home(){const ph=innerWidth<innerHeight;cam.position.set(1.4,1.05,ph?3.3:2.7);oc.target.set(0,0.60,0);oc.update()}
const oc=new OrbitControls(cam,r.domElement);oc.enableDamping=true;oc.minDistance=0.4;oc.maxDistance=8;
s.add(new THREE.HemisphereLight(0xffffff,0x8d8a85,1.7));const d=new THREE.DirectionalLight(0xffffff,1.9);d.position.set(3,6,4);d.castShadow=true;d.shadow.mapSize.set(2048,2048);Object.assign(d.shadow.camera,{left:-2,right:2,top:3,bottom:-1});s.add(d);
const g=new THREE.Mesh(new THREE.CircleGeometry(8,64),new THREE.MeshStandardMaterial({color:0xb8bbbf,roughness:1}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;s.add(g);
const L=new GLTFLoader();L.setMeshoptDecoder(MeshoptDecoder);
const FILES={squat_v4:'female_squat_v4.glb',squat_pulse_v2:'female_squat_pulse_v2.glb',squat_v3:'female_squat_v3.glb',squat_pulse:'female_squat_pulse_v1.glb',squat_v2:'female_squat_v2.glb',squat:'female_squat.glb'};
const PULSE=new Set(['squat_pulse','squat_pulse_v2']);
let cur=null,tok=0,mixer=null,action=null,playing=true,speed=1.0;
const clock=new THREE.Clock();
window.fv={ready:false,ver:null};
const msg=document.getElementById('msg');
const playBtn=document.getElementById('play');
const spdWrap=document.getElementById('spdWrap');
const spd=document.getElementById('spd');
const spdVal=document.getElementById('spdVal');
function setAnimUI(on){
  playBtn.style.display=on?'':'none';
  spdWrap.style.display=on?'flex':'none';
  if(on){playing=true;playBtn.textContent='Pause';spd.value='1';speed=1;spdVal.textContent='1.0/s'}
}
function loadVer(v){const my=++tok;window.fv.ready=false;window.fv.ver=v;msg.textContent='Loading '+v+'…';
 if(mixer){mixer.stopAllAction();mixer=null;action=null}
 if(cur){s.remove(cur);cur.traverse(o=>{if(o.isMesh){o.geometry.dispose();if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>m.dispose&&m.dispose())}}});cur=null}
 setAnimUI(PULSE.has(v));
 L.load(FILES[v],gl=>{if(my!==tok)return;gl.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{if(!m)return;if(/hair|eyebrow|eyelash|high-poly/i.test(m.name||o.name||'')){m.alphaTest=0.5;m.side=THREE.DoubleSide}else{m.alphaTest=0;m.transparent=false;m.opacity=1;m.depthWrite=true}if(/Bikini/i.test(m.name||o.name||'')){m.side=THREE.DoubleSide;m.roughness=0.55;m.transparent=false;m.opacity=1;m.depthWrite=true}m.needsUpdate=true})}});
  const b=new THREE.Box3().setFromObject(gl.scene);gl.scene.position.y-=b.min.y;cur=gl.scene;s.add(cur);home();
  if(gl.animations&&gl.animations.length){
    mixer=new THREE.AnimationMixer(cur);
    action=mixer.clipAction(gl.animations[0]);
    action.loop=THREE.LoopRepeat;action.clampWhenFinished=false;
    action.timeScale=speed;action.play();playing=true;playBtn.textContent='Pause';
  }
  msg.textContent=v+(PULSE.has(v)?' · play/pause · speed 0.3–2/s':'')+' · drag to orbit · pinch / scroll to zoom';
  window.fv.ready=true;window.fv.meshes=0;cur.traverse(o=>{if(o.isMesh&&o.visible)window.fv.meshes++})},
  e=>{if(e.total)msg.textContent='Loading '+v+'… '+Math.round(100*e.loaded/e.total)+'%'},e=>{msg.textContent='Load error: '+e})}
document.getElementById('ver').onchange=e=>loadVer(e.target.value);loadVer('squat_v4');
document.getElementById('rs').onclick=home;
playBtn.onclick=()=>{if(!action)return;playing=!playing;if(playing){action.paused=false;playBtn.textContent='Pause'}else{action.paused=true;playBtn.textContent='Play'}};
spd.oninput=()=>{speed=parseFloat(spd.value)||1;spdVal.textContent=speed.toFixed(1)+'/s';if(action)action.timeScale=speed};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
r.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer&&playing)mixer.update(dt);oc.update();r.render(s,cam)});
</script></body></html>
